[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
authors = [
    {name = "Moritz Breurather", email = "breurather@ift.at"},
]

description = """A reimplementation of the FOCAS protocol using UNIX sockets."""
keywords = [
    "focas",
    "fanuc",
]

name = "pyfocas"
readme = "README.md"
requires-python = ">=3.10,<4"
version = "0.1"

[project.scripts]
pyfocas = "pyfocas.main:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.16.1",
]

[tool.black]
line-length = 79
preview = true
unstable = true
enable-unstable-feature = ["string_processing"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
# - Use doctests
# - Verbose output
addopts = "--doctest-modules -v"
